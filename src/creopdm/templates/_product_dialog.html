{# New / rename product: shared by the Files page and the Details pages (the sidebar's New button). #}
<dialog id="product-dialog" class="dialog">
  <form method="dialog" id="product-form">
    <h2 id="product-dialog-title">New product</h2>
    <label>Name
      <input name="name" required maxlength="255" placeholder="Robot Arm">
    </label>
    <label>Number
      <input name="number" maxlength="25" placeholder="PRJ-0027">
    </label>
    <label>Description
      <textarea name="description" rows="3" maxlength="256" placeholder="Prototype robotic arm"></textarea>
    </label>
    {% if template_choices %}
    <label id="product-template-row">Start from template
      <select name="template_id" id="product-template">
        <option value="">None</option>
        {% for choice in template_choices %}
        <option value="{{ choice.uuid }}">{{ choice.name }}</option>
        {% endfor %}
      </select>
    </label>
    {% endif %}
    {% include "partials/product_vault_fields.html" %}
    <p class="error" id="product-error" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn" value="cancel" id="product-cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="product-submit">Create</button>
    </div>
  </form>
</dialog>
