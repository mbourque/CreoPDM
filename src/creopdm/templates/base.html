<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ app_version }}-folder2">
  <script>
    /* Suppress PTC creojs.js noise outside Creo's browser (and when Creo injects its own copy). */
    (function () {
      var nativeAlert = window.alert;
      window.alert = function (message) {
        var text = String(message == null ? "" : message);
        if (text.indexOf("Creo environment which is not supported") !== -1) return;
        return nativeAlert.apply(window, arguments);
      };
    })();
  </script>
</head>
<body
  data-agent-base="{{ agent_base_url | default('http://127.0.0.1:8766') }}"
  data-workspace-poll-ms="{{ workspace_poll_interval_ms | default('2000') }}"
>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">{{ app_name }}</div>
        <div class="brand-version">Version {{ app_version }}</div>
      </div>
    </a>
    <div class="status-cluster">
      <a class="status-pill" href="/settings">Settings</a>
      <span class="status-pill" data-state="running">Status: Running</span>
      <span id="creo-status" class="status-pill" data-state="{% if creo_label == 'Connected' %}ok{% else %}idle{% endif %}" data-creo-open-mode="{{ creo_open_mode }}" title="{{ creo_open_title }}">
        Creo: {{ creo_label }} · {{ creo_open_name }}
      </span>
    </div>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  <dialog id="danger-confirm-dialog" class="dialog">
    <form method="dialog" id="danger-confirm-form">
      <h2 id="danger-confirm-title">Confirm</h2>
      <p id="danger-confirm-lead"></p>
      <p id="danger-confirm-note"><strong></strong></p>
      <label>Type the project name to confirm
        <input name="confirm_name" id="danger-confirm-input" required maxlength="255" autocomplete="off">
      </label>
      <p class="error" id="danger-confirm-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="danger-confirm-cancel">Cancel</button>
        <button type="submit" class="btn btn-danger" id="danger-confirm-submit">Confirm</button>
      </div>
    </form>
  </dialog>
  <dialog id="busy-overlay" class="busy-overlay">
    <div class="busy-panel" role="status" aria-live="polite">
      <span class="busy-spinner" aria-hidden="true"></span>
      <p id="busy-message">Working…</p>
    </div>
  </dialog>
  <div id="file-drop-overlay" hidden>
    <p>Drop files, folders, or file links to add them</p>
  </div>
  <script type="text/creojs" id="creopdm-open.creojs">
function creoLogicalFileName(filename) {
    var base = String(filename || "");
    var slash = Math.max(base.lastIndexOf("/"), base.lastIndexOf("\\"));
    if (slash >= 0) {
        base = base.substring(slash + 1);
    }
    var lower = base.toLowerCase();
    var dot = lower.lastIndexOf(".");
    if (dot > 0) {
        var tail = lower.substring(dot + 1);
        var asNumber = parseInt(tail, 10);
        if (String(asNumber) === tail) {
            base = base.substring(0, dot);
        }
    }
    return base;
}
function creoIsNativeVersioned(filename) {
    // Only native Creo .prt/.asm/.drw carry a save release for version gating.
    // Other Creo-openable formats (STEP, SolidWorks, …) skip the check.
    var logical = creoLogicalFileName(filename).toLowerCase();
    return /\.(prt|asm|drw)$/.test(logical);
}
function creoModelRoot(logical) {
    var dot = String(logical || "").lastIndexOf(".");
    return dot > 0 ? logical.substring(0, dot) : logical;
}
function openAsmAsMfg(session, filename) {
    var logical = creoLogicalFileName(filename);
    var lower = logical.toLowerCase();
    var dot = lower.lastIndexOf(".");
    var suffix = dot >= 0 ? lower.substring(dot) : "";
    if (suffix !== ".asm") {
        return false;
    }
    var root = creoModelRoot(logical);
    if (!root || typeof pfcModelType === "undefined") {
        return false;
    }
    var descr = pfcModelDescriptor.Create(pfcModelType.MDL_MFG, root, "");
    var win = session.OpenFile(descr);
    if (!win) {
        return false;
    }
    try {
        win.Activate();
    } catch (err) {}
    return true;
}
function creoMajorRelease(release) {
    var text = String(release || "");
    var match = text.match(/^(\d+)/)
        || text.match(/(?:Creo|Parametric)\s+(\d+)/i)
        || text.match(/(\d+)\.\d+/);
    if (!match) {
        return 0;
    }
    return parseInt(match[1], 10);
}
function creoSessionRelease(session) {
    var value = "";
    try {
        if (typeof session.GetRelease === "function") {
            value = String(session.GetRelease());
        }
    } catch (err) {}
    if (!value) {
        try {
            if (typeof session.GetVersion === "function") {
                value = String(session.GetVersion());
            }
        } catch (err2) {}
    }
    return value;
}
function creoNewerThanSession(fileRelease, sessionRelease) {
    var fileMajor = creoMajorRelease(fileRelease);
    var sessionMajor = creoMajorRelease(sessionRelease);
    return fileMajor > 0 && sessionMajor > 0 && fileMajor > sessionMajor;
}
function creoCannotOpenNewerMessage(filename, fileRelease, sessionRelease) {
    var name = String(filename || "This model");
    if (fileRelease && sessionRelease) {
        return name + " was saved in Creo " + fileRelease
            + ". This session is Creo " + sessionRelease
            + " and cannot open a newer model.";
    }
    if (fileRelease) {
        return name + " was saved in Creo " + fileRelease
            + ". Older Creo versions cannot open it.";
    }
    return "Creo could not retrieve " + name;
}
function creoOpenFailedMessage(filename, fileRelease, sessionRelease, detail) {
    if (creoNewerThanSession(fileRelease, sessionRelease)) {
        return creoCannotOpenNewerMessage(filename, fileRelease, sessionRelease);
    }
    var name = String(filename || "This model");
    var extra = detail ? (" " + String(detail)) : "";
    if (fileRelease && sessionRelease) {
        return "Creo could not open " + name
            + " (file Creo " + fileRelease + ", session Creo " + sessionRelease
            + ")." + extra;
    }
    if (fileRelease) {
        return "Creo could not open " + name
            + " (saved in Creo " + fileRelease + ")." + extra;
    }
    return "Creo could not open " + name + "." + extra;
}
function creoOpenFailed(message) {
    return "CREOPDM_ERROR:" + message;
}
function creoJoinPath(directory, name) {
    var dir = String(directory || "").replace(/[\\\/]+$/, "");
    var file = String(name || "");
    if (!dir) return file;
    if (!file) return dir;
    return dir + "/" + file;
}
function creoNormalizePath(path) {
    return String(path || "").replace(/\\/g, "/");
}
function creoTryOpenName(session, directory, name) {
    if (!name) {
        return null;
    }
    var model = null;
    var fullPath = directory ? creoJoinPath(directory, name) : name;
    fullPath = creoNormalizePath(fullPath);
    var shortName = creoNormalizePath(name);
    try {
        var descrPath = pfcModelDescriptor.CreateFromFileName(fullPath);
        if (typeof session.OpenFile === "function") {
            var win = session.OpenFile(descrPath);
            if (win) {
                try { win.Activate(); } catch (errAct) {}
                try {
                    if (typeof win.Model !== "undefined" && win.Model) {
                        return win.Model;
                    }
                } catch (errModel) {}
                try {
                    if (typeof win.GetModel === "function") {
                        model = win.GetModel();
                        if (model) return model;
                    }
                } catch (errGet) {}
            }
        }
        // RetrieveModel ignores descriptor path; WithOpts uses the path (needed for
        // non-search-path files such as the local agent cache).
        if (typeof session.RetrieveModelWithOpts === "function"
            && typeof pfcRetrieveModelOptions !== "undefined") {
            try {
                var opts = pfcRetrieveModelOptions.Create();
                model = session.RetrieveModelWithOpts(descrPath, opts);
                if (model) return model;
            } catch (errOpts) {}
        }
        model = session.RetrieveModel(descrPath);
        if (model) return model;
    } catch (errPath) {}
    try {
        var descr = pfcModelDescriptor.CreateFromFileName(shortName);
        if (typeof session.RetrieveModelWithOpts === "function"
            && typeof pfcRetrieveModelOptions !== "undefined"
            && directory) {
            try {
                var descrDir = pfcModelDescriptor.CreateFromFileName(
                    creoNormalizePath(creoJoinPath(directory, shortName))
                );
                var opts2 = pfcRetrieveModelOptions.Create();
                model = session.RetrieveModelWithOpts(descrDir, opts2);
                if (model) return model;
            } catch (errOpts2) {}
        }
        model = session.RetrieveModel(descr);
        if (model) return model;
    } catch (errName) {}
    try {
        model = session.GetModelFromFileName(shortName);
    } catch (errGetName) {
        model = null;
    }
    return model;
}
function creoTrailEscapePath(path) {
    // Trail Inputname expects Windows separators; backslashes are doubled.
    return String(path || "").replace(/\//g, "\\").replace(/\\/g, "\\\\");
}
function creoTryOpenViaTrail(session, directory, diskName, fullPath) {
    /**
     * Drive File > Open without changing Creo's session working directory.
     * Navigates the dialog address bar to the agent cache folder, sets Type to
     * All Files (db_-1), then opens the short file name.
     */
    if (!session || typeof session.RunMacro !== "function") {
        return false;
    }
    var absolute = fullPath
        ? String(fullPath)
        : (directory && diskName ? creoJoinPath(directory, diskName) : "");
    var shortName = diskName || (absolute ? absolute.replace(/^.*[\\\/]/, "") : "");
    var folder = directory ? String(directory) : "";
    if (!folder && absolute) {
        folder = absolute.replace(/[\\\/][^\\\/]+$/, "");
    }
    if (!folder || !shortName) {
        return false;
    }
    var folderTrail = creoTrailEscapePath(folder);
    var nameTrail = creoTrailEscapePath(shortName);
    var macro =
        "~ Command `ProCmdModelOpen`;"
        + "~ Trail `` `` `DLG_PREVIEW_POST` `file_open`;"
        // Navigate the File Open embedded-browser address bar to the cache folder.
        + "~ Input `file_open` `opt_EMBED_BROWSER_TB_SAB_LAYOUT` `" + folderTrail + "`;"
        + "~ Update `file_open` `opt_EMBED_BROWSER_TB_SAB_LAYOUT` `" + folderTrail + "`;"
        + "~ Activate `file_open` `opt_EMBED_BROWSER_TB_SAB_LAYOUT`;"
        + "~ Open `file_open` `Type`;"
        + "~ Close `file_open` `Type`;"
        + "~ Select `file_open` `Type` 1 `db_-1`;"
        + "~ Trail `` `` `PREVIEW_POPUP_TIMER` `file_open:Ph_list.Filelist:<NULL>`;"
        + "~ Input `file_open` `Inputname` `" + nameTrail + "`;"
        + "~ Update `file_open` `Inputname` `" + nameTrail + "`;"
        + "~ Command `ProFileSelPushOpen_Standard@context_dlg_open_cmd`;";
    try {
        session.RunMacro(macro);
        return true;
    } catch (err) {
        return false;
    }
}
function openModel(directory, filename, fileRelease, diskName, fullPath) {
    var openDetail = "";
    var session = null;
    var previousWd = "";
    var changedWd = false;
    try {
        session = (typeof pfcGetCurrentSession === "function")
          ? pfcGetCurrentSession()
          : pfcGetProESession();
        var versionName = diskName || filename;
        // Native assemblies need the session WD on the cache folder so Creo can
        // resolve companions. Restore the prior WD after the open so the
        // user's session directory is not left on the agent cache.
        // Multi-CAD trails navigate the File Open dialog and must not ChangeDirectory.
        if (directory && creoIsNativeVersioned(versionName)) {
            try {
                if (typeof session.GetCurrentDirectory === "function") {
                    previousWd = String(session.GetCurrentDirectory() || "");
                }
            } catch (errGet) {
                previousWd = "";
            }
            try {
                var cacheDir = creoNormalizePath(directory);
                if (!previousWd || creoNormalizePath(previousWd).toLowerCase() !== cacheDir.toLowerCase()) {
                    session.ChangeDirectory(cacheDir);
                    changedWd = true;
                }
            } catch (errDir) {
                openDetail = "ChangeDirectory failed for " + directory + ".";
            }
        }
        var sessionRelease = creoSessionRelease(session);
        if (creoIsNativeVersioned(versionName)
            && creoNewerThanSession(fileRelease, sessionRelease)) {
            return creoOpenFailed(creoCannotOpenNewerMessage(filename, fileRelease, sessionRelease));
        }
        try {
            if (openAsmAsMfg(session, diskName || filename)) {
                return filename;
            }
        } catch (errMfg) {}
        var model = null;
        if (fullPath) {
            model = creoTryOpenName(session, "", fullPath);
        }
        if (!model && diskName && diskName !== filename) {
            model = creoTryOpenName(session, directory, diskName);
        }
        if (!model) {
            model = creoTryOpenName(session, directory, filename);
        }
        if (!model) {
            var preparedPath = fullPath || creoJoinPath(directory, diskName || filename);
            if (!creoIsNativeVersioned(versionName)
                && creoTryOpenViaTrail(session, directory, diskName || filename, preparedPath)) {
                return filename;
            }
            if (!openDetail) {
                openDetail = "CreoPDM prepared " + preparedPath
                    + ". Creo must read that path on the machine running Creo "
                    + "(same computer or shared folder as CreoPDM).";
            }
            var releaseForMsg = creoIsNativeVersioned(versionName) ? fileRelease : "";
            return creoOpenFailed(creoOpenFailedMessage(filename, releaseForMsg, sessionRelease, openDetail));
        }
        try {
            model.Display();
        } catch (err) {}
        try {
            var win = session.GetModelWindow(model);
            if (!win) {
                win = session.CreateModelWindow(model);
            }
            if (win) {
                win.Activate();
            }
        } catch (err) {
            try {
                session.CurrentWindow.Activate();
            } catch (err2) {}
        }
        return filename;
    } catch (errAll) {
        var detail = errAll && errAll.message ? String(errAll.message) : String(errAll || "");
        var releaseCatch = creoIsNativeVersioned(diskName || filename) ? fileRelease : "";
        return creoOpenFailed(creoOpenFailedMessage(filename, releaseCatch, "", detail));
    } finally {
        if (changedWd && session && previousWd) {
            try {
                session.ChangeDirectory(previousWd);
            } catch (errRestore) {}
        }
    }
}
function setWorkingDirectory(directory) {
    try {
        var session = (typeof pfcGetCurrentSession === "function")
          ? pfcGetCurrentSession()
          : pfcGetProESession();
        if (!directory) {
            return "CREOPDM_ERROR:No project is selected.";
        }
        try {
            session.ChangeDirectory(directory);
        } catch (errDir) {
            var detail = "";
            try {
                detail = errDir && errDir.message ? String(errDir.message) : "";
            } catch (errMsg) {
                detail = "";
            }
            if (!detail || detail === "[object Object]" || detail === "{}") {
                detail = "Creo could not change to:\n" + directory
                    + "\nUse a folder on this Creo PC (creopdm-agent cache when CreoPDM is remote).";
            }
            return "CREOPDM_ERROR:" + detail;
        }
        return String(directory);
    } catch (errAll) {
        var fallback = "";
        try {
            fallback = errAll && errAll.message ? String(errAll.message) : "";
        } catch (errMsg2) {
            fallback = "";
        }
        if (!fallback || fallback === "[object Object]" || fallback === "{}") {
            fallback = "Creo could not set the working directory.";
        }
        return "CREOPDM_ERROR:" + fallback;
    }
}
  </script>
  <script src="/client/app.js?v={{ app_version }}-push2"></script>
</body>
</html>
