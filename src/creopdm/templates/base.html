<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ app_version }}-cwd2">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">{{ app_name }}</div>
        <div class="brand-version">Version {{ app_version }}</div>
      </div>
    </a>
    <div class="status-cluster">
      <a class="status-pill" href="/settings">Settings</a>
      <span class="status-pill" data-state="running">Status: Running</span>
      <span class="status-pill" data-state="{% if creo_label == 'Connected' %}ok{% else %}idle{% endif %}"{% if creo_executable %} title="{{ creo_executable }}"{% endif %}>
        Creo: {{ creo_label }}
      </span>
    </div>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  <dialog id="busy-overlay" class="busy-overlay">
    <div class="busy-panel" role="status" aria-live="polite">
      <span class="busy-spinner" aria-hidden="true"></span>
      <p id="busy-message">Working…</p>
    </div>
  </dialog>
  <div id="file-drop-overlay" hidden>
    <p>Drop files, folders, or file links to add them</p>
  </div>
  <script type="text/creojs" id="creopdm-open.creojs">
function openModel(directory, filename) {
    var session = (typeof pfcGetCurrentSession === "function")
      ? pfcGetCurrentSession()
      : pfcGetProESession();
    if (directory) {
        session.ChangeDirectory(directory);
    }
    var descr = pfcModelDescriptor.CreateFromFileName(filename);
    var model = null;
    try {
        model = session.RetrieveModel(descr);
    } catch (err) {
        model = session.GetModelFromFileName(filename);
    }
    if (!model) {
        throw new Error("Creo could not retrieve " + filename);
    }
    try {
        model.Display();
    } catch (err) {}
    try {
        var win = session.GetModelWindow(model);
        if (!win) {
            win = session.CreateModelWindow(model);
        }
        if (win) {
            win.Activate();
        }
    } catch (err) {
        try {
            session.CurrentWindow.Activate();
        } catch (err2) {}
    }
    return filename;
}
function setWorkingDirectory(directory) {
    var session = (typeof pfcGetCurrentSession === "function")
      ? pfcGetCurrentSession()
      : pfcGetProESession();
    if (!directory) {
        throw new Error("No project workspace is selected.");
    }
    session.ChangeDirectory(directory);
    return directory;
}
  </script>
  <script src="/static/js/app.js?v={{ app_version }}-cwd2"></script>
</body>
</html>
