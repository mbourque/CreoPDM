<div id="product-vault-fields" class="product-vault-fields">
  <label>Vault/Workspace name
    <input name="vault_folder" id="product-vault-folder" maxlength="200" autocomplete="off" spellcheck="false" placeholder="robot-arm" value="{{ vault_folder|default('', true) }}">
  </label>
  <div class="checkbox-row">
    <input type="checkbox" name="use_hash" id="product-use-hash" {% if use_hash|default(true) %}checked{% endif %}>
    <label for="product-use-hash">Use hash</label>
  </div>
  <p class="muted small" id="product-vault-hint">Folder under the vaults directory. With Use hash, the UUID is locked in. Uncheck to type your own name (no spaces).</p>
  <p class="error" id="product-vault-error" hidden></p>
</div>
