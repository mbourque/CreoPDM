<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ selected.name if selected else app_name }} — Explorer</title>
  <link rel="stylesheet" href="/static/css/embed_explorer.css?v={{ app_version }}-tog2">
</head>
<body
  id="embed-explorer"
  data-agent-base="{{ agent_base_url | default('http://127.0.0.1:8766') }}"
  data-agent-token="{{ agent_token | default('') }}"
  data-purgeable="{{ purgeable_extensions | default([]) | join(',') }}"
  data-product-uuid="{{ selected.uuid if selected else '' }}"
  data-vault-folder="{{ selected.vault_folder if selected else '' }}"
  data-product-name="{{ selected.name if selected else '' }}"
  data-initial-folder="{{ initial_folder or '' }}"
  data-focus-uuid="{{ focus_uuid or '' }}"
  data-focus-filename="{{ focus_filename or '' }}"
  data-follow-active="{{ '1' if follow_active else '0' }}"
  data-query-product="{{ query_product or '' }}"
  data-query-file="{{ query_file or '' }}"
  data-query-folder="{{ query_folder or '' }}"
  data-allows-content="{{ '1' if product_ui.allows_content else '0' }}"
  data-show-open="{{ '1' if product_ui.show_open else '0' }}"
  data-show-checkout="{{ '1' if product_ui.show_checkout else '0' }}"
  data-show-undo="{{ '1' if product_ui.show_undo_checkout else '0' }}"
  data-show-checkin="{{ '1' if product_ui.show_checkin else '0' }}"
  data-show-export="{{ '1' if product_ui.show_export_objects else '0' }}"
  data-can-export="{{ '1' if can_export_objects else '0' }}"
  data-can-checkout="{{ '1' if can_checkout else '0' }}"
  data-can-checkin="{{ '1' if can_checkin else '0' }}"
  data-top-level-assemblies="{{ top_level_assembly_uuids | default([]) | join(',') }}"
>
  <header class="ex-header">
    <div class="ex-title-row">
      <h1 class="ex-product" id="ex-product-name" title="{{ selected.name if selected else 'No product' }}">
        {% if selected %}{{ selected.name }}{% else %}No product{% endif %}
      </h1>
      <div class="ex-type-toggles" id="ex-type-toggles" role="group" aria-label="Filter by type" title="Parts / Assemblies / Drawings filter together (OR). Top Level is exclusive. None on = all files.">
        <button type="button" class="ex-type-toggle" id="ex-filter-part" data-type="part" aria-pressed="false" title="Parts">
          <img src="/static/icons/part.png" alt="" width="18" height="18" decoding="async">
          <span class="visually-hidden">Parts</span>
        </button>
        <button type="button" class="ex-type-toggle" id="ex-filter-assembly" data-type="assembly" aria-pressed="false" title="Assemblies">
          <img src="/static/icons/assembly.png" alt="" width="18" height="18" decoding="async">
          <span class="visually-hidden">Assemblies</span>
        </button>
        <button type="button" class="ex-type-toggle" id="ex-filter-drawing" data-type="drawing" aria-pressed="false" title="Drawings">
          <img src="/static/icons/drawing.png" alt="" width="18" height="18" decoding="async">
          <span class="visually-hidden">Drawings</span>
        </button>
        <button type="button" class="ex-type-toggle" id="ex-filter-top-level" data-type="top_level" aria-pressed="false" title="Top Level assemblies (exclusive)">
          <img src="/static/icons/top_level.svg" alt="" width="18" height="18" decoding="async">
          <span class="visually-hidden">Top Level assemblies</span>
        </button>
      </div>
      <span class="ex-state" id="ex-product-state" data-state="{{ product_state_key or '' }}" title="Product state"{% if not selected or not product_state_label %} hidden{% endif %}>{{ product_state_label or '' }}</span>
      <button type="button" class="ex-icon-btn" id="ex-refresh" title="Refresh to the active product / file list">↻</button>
    </div>
    <label class="ex-search">
      <span class="visually-hidden">Search</span>
      <input type="search" id="ex-search" placeholder="Search files…" autocomplete="off" {% if not selected %}disabled{% endif %}>
    </label>
  </header>

  <div class="ex-status" id="ex-banner" hidden></div>

  {% if not selected %}
  <p class="ex-empty">No accessible product. Sign in or pass <code>?product=</code>.</p>
  {% else %}
  <div class="ex-tree" id="ex-tree" role="tree" aria-label="Product files" data-list-state="loading">
    <p class="ex-loading" id="ex-loading">Loading files…</p>
  </div>
  <div class="ex-list-error" id="ex-list-error" hidden>
    <p class="ex-empty is-error" id="ex-list-error-text">Could not load files.</p>
    <button type="button" class="ex-btn" id="ex-retry">Retry</button>
  </div>
  <p class="ex-msg" id="ex-msg" role="status" aria-live="polite"></p>
  {% endif %}

  <div id="ex-context-menu" class="ex-context-menu" role="menu" hidden></div>

  <script src="/static/js/local_cache_pending.js?v={{ app_version }}-local-cache"></script>
  <script src="/static/js/files_context_menu.js?v={{ app_version }}-files-ctx"></script>
  <script src="/static/js/embed_explorer.js?v={{ app_version }}"></script>
</body>
</html>
