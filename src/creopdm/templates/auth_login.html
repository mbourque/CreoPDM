{% extends "base.html" %}
{% block title %}Sign in — {{ app_name }}{% endblock %}
{% block content %}
<article class="detail settings-page">
  <h1>Sign in</h1>
  <p class="muted">Use your CreoPDM username and password.</p>

  <form method="post" action="/login" class="settings-form">
    <section class="settings-card">
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <label>Username
        <input name="username" type="text" value="{{ username or '' }}" required autocomplete="username" maxlength="64" autofocus>
      </label>
      <label>Password
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <p><button type="submit" class="btn btn-primary">Sign in</button></p>
    </section>
  </form>
</article>
{% endblock %}
