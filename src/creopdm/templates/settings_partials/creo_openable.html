<section class="settings-card">
  <p class="muted small">Types Creo can open. Click-to-open uses Creo for these files. Numbered saves such as <code>shaft.prt.3</code> and <code>outline.dxf.4</code> count as those extensions.</p>
  <label>Creo-openable extensions
    <textarea name="cad_model_extensions" rows="3" placeholder=".prt, .asm, .drw">{{ settings.cad_model_extensions | join(', ') }}</textarea>
  </label>
  <p class="muted small">Comma-separated, with or without the dot.</p>
</section>
