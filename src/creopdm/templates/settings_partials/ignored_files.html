<section class="settings-card">
  <p class="muted small">These never enter the vault, are never stored in Git, and never appear in the file list. Patterns are written to each product's <code>.gitignore</code>.</p>
  <label>Ignore patterns
    <textarea name="ignore_patterns" rows="3" placeholder="*.tst, trail.txt*, std.out">{{ settings.ignore_patterns | join(', ') }}</textarea>
  </label>
  <p class="muted small">Comma-separated gitignore patterns.</p>
</section>
