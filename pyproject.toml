[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creopdm"
version = "0.1.0"
description = "Lightweight local-first Product Data Management for PTC Creo Parametric"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "CreoPDM" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[project.scripts]
creopdm = "creopdm.main:run_cli"
creopdm-agent = "creopdm_agent.main:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
creopdm = [
    "templates/**/*",
    "static/**/*",
    "database/migrations/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --basetemp=pytest-tmp"
cache_dir = "pytest-cache"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
